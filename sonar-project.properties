# SonarCloud, CI-BASED analysis (TD-015).
#
# This file is inert under Automatic Analysis and only takes effect once the
# scanner runs from ci.yml. Automatic Analysis was how this project was scanned
# until 2026-08-28, and its documentation says of test coverage, in full:
# "Code coverage information is not supported." That is why the project reported
# 0.0% coverage while the suite sat at 91%. The two modes are mutually
# exclusive - Automatic Analysis must be OFF for this to be used at all.

sonar.projectKey=vxture_vx-agent-yucer
sonar.organization=vx-6b309295f6500aba6b2a71a29ee27de77fa41583

# The WHOLE REPO, as before. Automatic Analysis scanned everything, and
# narrowing the scope while switching modes would show up as a pile of
# "resolved" issues that nobody fixed.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/node_modules/**,**/.next/**,**/dist/**,**/generated/**

# BOTH HALVES, merged (TD-020). Paths inside are rewritten to be repo-root
# relative first: node emits them relative to its own cwd (portals/app), and the
# scanner resolves them against the project base dir, which is the repo root.
# Unrewritten, every file silently fails to match and the report reads 0% - the
# same wrong answer, arrived at a different way.
#
# `merged.info` and not `lcov.info`: the unit suite and the db suite cannot run
# in one process (DATABASE_URL flips prismaEnabled()), so ci.yml runs them as
# two jobs and the `sonar` job combines their reports with
# scripts/ci/merge-lcov.mjs. Reading either half alone is a measurement of a run
# in which half the code could not execute - the offline half put every Prisma
# adapter in the 50s and reported authz/prisma-store.ts at 52.7% while it is
# actually 98.2%.
#
# A comma-separated list of both paths would also be accepted here. It is not
# used because the scanner's merge semantics for a file appearing in BOTH
# reports are not something this repo can verify, and "last one wins" would
# silently discard the offline coverage of every file the two suites share.
sonar.javascript.lcov.reportPaths=coverage/merged.info

# --- Where the coverage gate bites ------------------------------------------
#
# COVERAGE exclusions, not analysis exclusions: everything below is still
# scanned for bugs, smells and hotspots. It is only kept out of the coverage
# ratio.
#
# The line is the INTERFACE LAYER. `app/(app)` is pages, React components and
# the server actions that bind them; this repo has no component test
# infrastructure and never has - all 1505 tests are domain rules, services,
# guardrails and scripts. Counting a layer nobody has decided to test makes the
# gate measure the absence of that decision, and it would fail every UI change
# regardless of how well the logic behind it was tested.
#
# What stays measured is what IS tested: app/domains (rules, services, ports,
# adapters), app/authz, app/entitlement, and scripts. Keeping the Prisma
# adapters inside the ratio is what made their absence visible and is why they
# are now tested: this comment used to record that they had no tests at all,
# which stopped being true with #148 and #149 (eleven *.db.test.ts files, 157
# tests, driving the stores themselves rather than raw `pg`). Two of them still
# have none - copilot and strategy - and stay in the ratio for the same reason.
#
# Reversible: the day component tests exist, delete the first line.
#
# app/(demo) joined the list on 2026-08-29, and the mechanism of its absence is
# worth keeping: PR #90 changed eight (app) components - all excluded - plus
# TWO LINES of a (demo) page. Those two lines were therefore the entire "new
# code" population, uncovered, and the gate reported 0.0% on a PR whose logic
# was guard-tested. A ratio over a two-line denominator is not a measurement.
# The demo pages are interface-layer by the same reasoning as (app).
# --- Where the duplication gate bites ---------------------------------------
#
# The message catalogue is a TRANSLATION PAIR. messages.ts and messages.en.ts
# hold the same keys in the same order with different values, which is what a
# bilingual catalogue is - and to a token-based duplication detector, whose view
# of a string literal is opaque, that reads as two copies of one file. The gate
# reported 6.3% on a PR whose only sin was adding a panel's copy in both
# languages.
#
# Not the same judgement as the coverage exclusions below. There the metric was
# measuring a real gap and the answer was tests. Here it is measuring the
# existence of a second locale, and the only way to satisfy it would be to stop
# translating.
#
# The dictionaries are still ANALYSED - this is cpd only, so a bug or a smell in
# either file still reports.
#
# NOTE: real duplication inside one dictionary is now impossible to detect here,
# which is a cost. It was paid down first by hand in the same PR: eleven domain
# error dictionaries each carried their own copy of the three codes that come
# from `can()` rather than from any domain, and those now spread a shared
# GATE_ERROR instead.
# THE SECOND ENTRY IS A DIFFERENT ARGUMENT, so it gets its own paragraph.
#
# functional-domains.ts is a DECLARATIVE TABLE: five sibling objects, each
# `{ key, icon, modules: [built("x"), ...] }`. The repetition is the structure -
# that is what a table of five domains looks like - and to a token-based
# detector it reads as copy-paste.
#
# The tell that it is not: the two blocks the detector paired OVERLAP. It
# reported lines 102-168 against 120-180 of the same file, sharing 49 lines with
# themselves. Genuine copy-paste does not self-overlap; a repeating shape does.
#
# What tripped it was not new duplication. main already sat at 18.7% here
# (79 lines) and PR #170 changed nine lines that happened to fall inside that
# pre-existing span, so "new code duplication" read 10.8% against a 3%
# threshold. The gate was measuring WHERE the edit landed, not what it added.
#
# The two ways to satisfy it without this line were both worse: shorten the
# comment that explains the module order until fewer lines are "new" - gaming a
# metric, in a repo whose comments are half its documentation - or make the five
# objects structurally different from each other, which is deliberately
# damaging a data table to please a detector.
#
# ONLY THIS FILE, and that was measured rather than assumed. The neighbours a
# blanket rule would have swept in are all clean: navigation.ts 0.0%, board.ts
# 0.0%, nav-board.tsx 0.0%. Excluding them would blind three files that have
# nothing to hide.
#
# Cost, stated: real copy-paste inside functional-domains.ts is now invisible
# here. The file is 200 lines of table with one exported resolver; the guards in
# functional-domains.test.ts are what actually watch it.
sonar.cpd.exclusions=portals/app/app/(app)/lib/messages*.ts,portals/app/app/(app)/lib/functional-domains.ts

# docs/00-meta/published joined on 2026-09-04, and it is a DIFFERENT ARGUMENT
# from every line above it. There the metric measured a real gap and the honest
# answer was "we have not decided to test this layer". Here the metric cannot
# measure at all: coverage in this project is lcov from the two TypeScript
# suites, and these eight files are Python. Nothing instruments them, so their
# ratio is not a measured 0.0% - it is the absence of a measurement wearing a
# number, and any PR touching them fails the gate on new code that is entirely
# Python. #179 was the first, and it will not be the last.
#
# What they are: five generators that build the published YC document set, a
# build script, a shared system module, and verify.py, which checks every figure
# those documents state against the source they claim to transcribe. They run by
# hand before a publish. None of them reaches the product, the container, or any
# artifact a user can execute.
#
# verify.py deserves its own sentence, because the obvious alternative is worse.
# It IS the check - 231 lines whose entire purpose is to fail when a document
# and the repo disagree. Writing unit tests for it to satisfy a coverage gate
# would be trading one metric for another, and it already has the only proof
# that means anything: on the run that introduced its newest two checks it
# failed, on three real stale references, before anything was fixed.
#
# SCOPE WAS MEASURED, NOT ASSUMED. Every .py file in this repository lives in
# this one directory - eight of eight. So this is not "exclude Python", which
# would silently cover a future Python file written somewhere that matters; it
# names the directory that exists.
#
# Cost, stated: if these files are ever instrumented, or if product code ever
# lands here, this line hides it. Reversible - delete it and the ratio returns.
# What still watches them is verify.py itself, plus the docs numbering guardrail
# in quality-gate.
sonar.coverage.exclusions=portals/app/app/(app)/**,portals/app/app/(demo)/**,**/*.d.ts,**/prisma/**,scripts/init/**,docs/00-meta/published/**
