name: xiaoyu-beta-bootstrap

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Exact main commit; initialize registered beta DB/Redis only, no app or DDL"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-beta
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: beta
    steps:
      - name: Require pinned main and beta scope
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
          ACTUAL_REF: ${{ github.ref }}
          STACK_ROOT: ${{ vars.STACK_ROOT }}
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
        run: |
          set -euo pipefail
          test "$ACTUAL_REF" = refs/heads/main
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          test "$STACK_ROOT" = /srv/md1/yucer
          test "$PROJECT_NAME" = yucer-beta

      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify bootstrap boundaries
        run: python3 -m unittest discover -s scripts/qa -p 'test_xiaoyu_beta_supply*.py'

      - name: Require delivered beta config
        env:
          ENV_FILE_B64: ${{ secrets.ENV_FILE_BASE64 }}
        run: test -n "$ENV_FILE_B64"

      - name: Join tailnet and prepare SSH
        uses: ./.github/actions/tailnet-ssh-connect
        with:
          tailscale-oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          tailscale-oauth-secret: ${{ secrets.TAILSCALE_OAUTH_CLIENT_SECRET }}
          tailscale-tag: ${{ vars.TAILSCALE_OAUTH_CLIENT_TAG }}
          deploy-host: ${{ secrets.DEPLOY_HOST }}
          deploy-port: ${{ secrets.DEPLOY_PORT }}
          deploy-ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          deploy-ssh-passphrase: ${{ secrets.DEPLOY_SSH_KEY_PASSPHRASE }}
          deploy-known-hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

      - name: Initialize beta DB and Redis only
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          ENV_FILE_B64: ${{ secrets.ENV_FILE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          bundle="/tmp/yucer-beta-bootstrap-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh_opts=(-i ~/.ssh/deploy_key -p "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30)
          ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "umask 077; mkdir -m 700 '$bundle'"
          cleanup() { ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" "rm -rf -- '$bundle'" || true; }
          trap cleanup EXIT
          scp -i ~/.ssh/deploy_key -P "${DEPLOY_PORT:-22}" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            scripts/qa/xiaoyu-beta-supply-bootstrap.py scripts/qa/xiaoyu-beta-supply-readiness.py docker-compose.yml \
            "$DEPLOY_USER@$DEPLOY_HOST:$bundle/"
          printf '%s' "$ENV_FILE_B64" | ssh "${ssh_opts[@]}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "BETA_STACK_ROOT=/srv/md1/yucer BETA_PROJECT_NAME=yucer-beta python3 '$bundle/xiaoyu-beta-supply-bootstrap.py'"
