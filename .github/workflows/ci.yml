name: ci

# Trunk-based CI: runs on PRs to main and on push:main (the squash commit that
# lands on main is a new SHA, so it gets its own gate run). Does NOT deploy.
#
# Produces four of the five required status checks named in
# docs/50-deployment/rebuild/main-ruleset.json: `quality-gate` / `build` /
# `test-coverage` / `audit` (the fifth, `gitleaks`, is in secret-scan.yml). Job
# names are a stable contract - renaming one breaks branch protection. In the
# governance-shell batch `build` and `test-coverage` are green placeholders (no
# app, no tests yet); later batches replace them with real work while keeping
# the context names stable.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.ref_name) }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- Audit (SCA hard gate) --------------------------------------------------
  # Real SCA: osv-scanner scans pnpm-lock.yaml's full dependency tree against
  # the OSV vulnerability database and hard-blocks on any new finding. Runs the
  # pinned, sha256-verified binary directly (no third-party action: no license
  # or supply-chain concern), mirroring the gitleaks pattern in secret-scan.yml.
  # The baseline is empty (.osv-scanner.toml); new advisories must be fixed, not
  # suppressed. `audit` is a required check on main.
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Single point of upgrade (see https://github.com/google/osv-scanner/releases).
      # Bump both the version and the sha256 below together.
      OSV_SCANNER_VERSION: "2.4.0"
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache osv-scanner binary
        id: osv-cache
        uses: actions/cache@v4
        with:
          path: /tmp/osv-bin
          key: osv-scanner-${{ env.OSV_SCANNER_VERSION }}-linux-amd64

      - name: Download osv-scanner (cache miss only)
        if: ${{ steps.osv-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          sha256=15314940c10d26af9c6649f150b8a47c1262e8fc7e17b1d1029b0e479e8ed8a0
          url="https://github.com/google/osv-scanner/releases/download/v${OSV_SCANNER_VERSION}/osv-scanner_linux_amd64"
          mkdir -p /tmp/osv-bin
          # --proto/--proto-redir: -L follows redirects, and without these a
          # redirect to http:// would be followed silently. The sha256 below
          # catches a swapped artifact; this stops the plaintext hop.
          curl -fsSL --proto "=https" --proto-redir "=https" --tlsv1.2 "$url" -o /tmp/osv-bin/osv-scanner
          echo "${sha256}  /tmp/osv-bin/osv-scanner" | sha256sum -c -

      - name: OSV dependency scan
        shell: bash
        run: |
          set -euo pipefail
          chmod +x /tmp/osv-bin/osv-scanner
          # Must pass --config explicitly: when scanning a --lockfile,
          # osv-scanner does not auto-discover the repo-root config, so the
          # ignore baseline would silently not apply. A new advisory exits
          # non-zero and fails this required check.
          # --allow-no-lockfiles: the governance-shell batch has zero runtime
          # dependencies, so the lockfile lists 0 packages; without this flag
          # osv-scanner exits 128 ("no package sources"). Once batch 2 adds real
          # dependencies the flag is a no-op and this becomes a real scan.
          /tmp/osv-bin/osv-scanner scan -L pnpm-lock.yaml --config .osv-scanner.toml --allow-no-lockfiles

  # -- Static checks (feed quality-gate) --------------------------------------
  # Pure-node, zero-dependency checks that run without a pnpm install: the docs
  # numbering hard gate and a whitespace/marker check. quality-gate aggregates
  # this; later batches add type-check / lint / guardrails as they become real.
  static-checks:
    name: static-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Whitespace and conflict-marker check
        run: git diff --check

      - name: Docs numbering guardrail (strict)
        run: node scripts/guardrails/check-docs-numbering.mjs --strict

      - name: Increment grant guardrail (a new table must grant on itself)
        run: node scripts/guardrails/check-incr-grants.mjs --strict

      - name: Data architecture guardrail (DDL <-> Prisma lockstep)
        run: node scripts/guardrails/check-data-architecture.mjs --strict

      # The platform port registry needs a login, so CI cannot check this repo
      # against it. What CI can check is that the repo agrees with itself, which
      # is the half that drifts - the number gets changed in one carrier and not
      # the rest, and nothing errors until a login fails to redirect back.
      - name: Port consistency guardrail (registry rule R3)
        run: node scripts/guardrails/check-port-consistency.mjs --strict

      # product_251 D-3: machine-check the conformance clauses that can be
      # machine-checked, because a matrix written into a document is a snapshot
      # and it rots.
      - name: Error envelope guardrail (L1 spec X-1 / A-1)
        run: node scripts/guardrails/check-error-envelope.mjs --strict

      # The `audit` job above is the gate on incoming change; sca-watch.yml is
      # the scheduled scan of the idle trunk, which the gate cannot see. Two
      # copies of one scan can drift, and a watcher pinned to an older scanner
      # reports clean on findings the gate blocks - see TD-012.
      - name: SCA consistency guardrail (the watch scans like the gate)
        run: node scripts/guardrails/check-sca-consistency.mjs --strict

  # -- Quality gate (aggregator; stable required-check name) ------------------
  quality-gate:
    name: quality-gate
    runs-on: ubuntu-latest
    needs: [static-checks]
    steps:
      - name: Aggregate
        run: |
          echo "quality gate: all aggregated checks passed"

  # -- Build (required check): install the pnpm workspace, type-check the
  # shared package, and produce the Next.js standalone build for the app.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          # @vxture/shared resolves from GitHub Packages (org secret, visibility
          # "all" - every org repo's Actions can read it).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Type-check (shared)
        run: pnpm type-check:all

      - name: Build app (Next.js standalone)
        run: pnpm build
        env:
          # Provenance is read at runtime (server env), not baked by `next build`;
          # set GIT_SHA so the CI build environment is representative.
          GIT_SHA: ${{ github.sha }}

  # -- Test coverage (required check): run the app unit tests (node:test + tsx).
  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile
        env:
          # @vxture/shared resolves from GitHub Packages (org secret, visibility
          # "all" - every org repo's Actions can read it).
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      # `tee` with pipefail, so a failing suite still fails the job. Without
      # pipefail the pipeline's exit code is tee's, and a red suite would report
      # green - the one way this required check could lie.
      - name: Run tests
        run: |
          set -o pipefail
          pnpm --filter @yucer/app test:lcov | tee "$RUNNER_TEMP/test.log"

      # Node writes SF: paths relative to ITS cwd; the scanner resolves them
      # against the repo root. The script also refuses to write a report whose
      # paths do not exist - a report the scanner cannot match comes back as a
      # number rather than a gap, which is where TD-015 started.
      - name: Make coverage paths repo-root relative
        run: node scripts/ci/lcov-to-repo-root.mjs portals/app/coverage/lcov.info portals/app

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: portals/app/coverage/lcov.info
          retention-days: 7

      # The coverage figure exists on every run and, until now, was thrown away:
      # it lived in the log and nowhere else, so nobody could see it without
      # opening the job and scrolling. Lifting it into the run summary costs one
      # step and makes the number a thing people notice moving.
      #
      # NOT A GATE. No threshold is enforced here - picking one is an owner
      # decision, and a threshold added quietly is a threshold nobody agreed to.
      # See TD-015 for why SonarCloud reports 0.0% while this reports ~91%.
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Test coverage"
            echo
            echo '```'
            # Strips node's leading marker glyph and its space. `[^ ]* ` and
            # not `....` : the glyph is multibyte, and `.` counts bytes under a
            # C locale and characters under a UTF-8 one, so a fixed width is
            # right on one runner and eats two columns of the table on another.
            sed -n '/start of coverage report/,/end of coverage report/p' \
              "$RUNNER_TEMP/test.log" | sed 's/^[^ ]* //'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # -- SonarCloud (NOT a required check): static analysis plus the coverage
  # figure the project reported as 0.0% until 2026-08-28 (TD-015).
  #
  # ITS OWN JOB, not a step inside test-coverage, and deliberately so:
  # test-coverage IS one of the required five, and folding a third-party service
  # into it would let a SonarCloud outage block every merge. `db-contract` is
  # kept out of the required set for the same reason.
  #
  # This replaces Automatic Analysis, which cannot read coverage at all - the
  # two modes are mutually exclusive and Automatic Analysis must stay off.
  sonar:
    name: sonar
    needs: test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history: new-code detection and blame both need it, and a
          # shallow clone makes every line look like it was written today.
          fetch-depth: 0

      - name: Download coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage
          path: coverage

      - name: Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  # -- DB contract (NOT a required check): the DDL against a real Postgres.
  #
  # Every other job proves TypeScript. A UNIQUE index, a CHECK, a REVOKE and a
  # NULL comparison are properties of the database and of nothing else, so the
  # defects that live there were invisible to a fully green suite - including one
  # where a constraint the design leans on did not hold at all.
  #
  # Deliberately NOT in the required five (quality-gate / build / test-coverage /
  # audit / gitleaks). Adding a required check edits the branch-protection
  # ruleset, which is an owner decision; this runs and reports without gating.
  db-contract:
    name: db-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Ephemeral, per-job, thrown away at the end - and with NO password at
        # all. trust auth means there is no credential here to leak, to rotate,
        # or to be mistaken for a real one by a scanner. The container is
        # reachable only from this runner.
        image: postgres:18
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vxturebiz_yucer_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable corepack (pnpm from packageManager)
        run: corepack enable

      - name: Install (frozen lockfile, no lifecycle scripts)
        # --ignore-scripts: a dependency's postinstall is arbitrary code running
        # with the runner's token in the environment. This job needs none of it -
        # the DB tests talk to Postgres through `pg` and never load the Prisma
        # client, and the DDL is applied by psql.
        #
        # The build and test-coverage jobs above still install WITH scripts, and
        # should probably not; that is a separate change, because `build` runs
        # prisma generate and is a required check, so tightening it belongs in a
        # PR that can be judged on its own.
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NODE_AUTH_TOKEN }}

      - name: Apply the DDL, in the order db-init.yml applies it
        # Same sequence as .github/workflows/db-init.yml: the three-part baseline
        # then incr/ in name order. If these two ever disagree, this lane stops
        # testing what actually ships - so the order is copied deliberately and
        # db-init.yml remains the authority.
        run: |
          set -euo pipefail
          run() { psql -h localhost -U postgres -d vxturebiz_yucer_ci -v ON_ERROR_STOP=1 "$@"; }
          for f in 00_baseline.sql 97_service_role.sql 98_column_locks.sql; do
            echo "[db-contract] applying $f"
            run -f "deploy/database/ddl/$f"
          done
          for f in deploy/database/ddl/incr/*.sql; do
            echo "[db-contract] applying incr $(basename "$f")"
            run -f "$f"
          done

      - name: Run the DB-backed tests
        # ONLY the *.db.test.ts files, not the whole suite. DATABASE_URL flips
        # prismaEnabled(), so the shared registry would hand Prisma stores to
        # tests written against the in-memory ones - a green run here would then
        # mean something different from a green run in test-coverage.
        #
        # The same files self-skip in the ordinary suite, so they stay visible
        # (as skipped) to anyone running pnpm test on a laptop.
        run: pnpm --filter @yucer/app test:db
        env:
          DATABASE_URL: postgresql://postgres@localhost:5432/vxturebiz_yucer_ci
