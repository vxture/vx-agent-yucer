<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Yucer">
  <title>Yucer</title>
  <!-- The chain, which is the product's own claim: strategy to cash collected,
       one traceable line with a parent-child relation at every hop. The line
       carries the weight so the mark survives at 16px, where a hairline trail
       simply vanished; the joints are beads on it and the last stop lands.
       Two tones from the Vxture brand family, so the product mark sits beside
       the company mark rather than against it. -->
  <path d="M44 200 L104 140 L150 170 L206 66"
        fill="none" stroke="#1E51FF" stroke-width="26"
        stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="104" cy="140" r="12" fill="#B5C7FF"/>
  <circle cx="150" cy="170" r="12" fill="#B5C7FF"/>
  <circle cx="206" cy="66" r="32" fill="#1E51FF"/>
  <circle cx="206" cy="66" r="12" fill="#B5C7FF"/>
</svg>
