# Three-container stack for the app profile: <code>-app (Next.js) + <code>-redis
# (RP session store) + <code>-db (business data). PROJECT_NAME drives the
# compose project + container-name prefix so prod and beta never collide on one
# host (prod=<code>-*, beta=<code>-beta-*). Backing services are internal-only;
# only the app publishes a port. Structure/deploy details are exercised in the
# deployment batch (batch E).
name: ${PROJECT_NAME:-yucer}

services:
  app:
    container_name: ${PROJECT_NAME:-yucer}-app
    build:
      context: .
      dockerfile: portals/app/Dockerfile
      # Local `compose build` only; the deploy path pulls the CI-built image (which
      # injects real provenance). Honest dev/unknown defaults for local builds.
      args:
        APP_VERSION: ${APP_VERSION:-dev}
        GIT_SHA: ${GIT_SHA:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
        DEPLOY_STAGE: ${DEPLOY_STAGE:-dev}
    image: ${IMAGE_REGISTRY:-ghcr.io}/${IMAGE_NAMESPACE:-vxture}/${PRODUCT_CODE:-yucer}-app:${IMAGE_TAG:-local}
    # Load the full operator .env into the app so ALL runtime config (OIDC,
    # platform client, webhook, INTERNAL_JOB_TOKEN, STATUS_PAGE, ...) reaches it -
    # not just the few keys in `environment:` below. APP_ENV_FILE is the absolute
    # path deploy.sh passes (<root>/etc/.env); local dev falls back to ./.env.
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      NODE_ENV: production
      PORT: "5000"
      REDIS_URL: redis://${PROJECT_NAME:-yucer}-redis:6379
      DATABASE_URL: ${DATABASE_URL:-}
    ports:
      - "${APP_PUBLISH_PORT:-5000}:5000"
    # Gated on HEALTH, not on start order. A bare `depends_on` only waits for the
    # container to exist, so the app used to boot before postgres could accept a
    # connection, die, and be restarted forever by the policy below.
    depends_on:
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [appnet]
    restart: unless-stopped
    # A restart policy with no log cap is how a crash loop fills a disk: the
    # default json-file driver keeps every line forever. Bound it per container.
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    # Bound what one container can take from the host. Overridable per
    # environment; the point is that a default exists at all.
    mem_limit: ${APP_MEM_LIMIT:-2g}
    cpus: ${APP_CPUS:-2.0}

  redis:
    container_name: ${PROJECT_NAME:-yucer}-redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - ${DATA_DIR:-./data}/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    mem_limit: ${REDIS_MEM_LIMIT:-512m}
    cpus: ${REDIS_CPUS:-1.0}

  db:
    container_name: ${PROJECT_NAME:-yucer}-db
    image: postgres:16-alpine
    environment:
      # The container superuser is the DB OWNER, NOT the service role. The DDL
      # (db-init, as this owner) creates the least-privilege <code>_svc role that
      # the app connects as via DATABASE_URL (product_240 section 2.7: connect
      # identity = <code>_svc, never owner-direct).
      POSTGRES_DB: ${POSTGRES_DB:-vxturebiz_${PRODUCT_CODE_SNAKE:-yucer}_prod}
      POSTGRES_USER: ${POSTGRES_DB_OWNER:-postgres}
      # REQUIRED, not defaulted-to-empty. The postgres image refuses to start on
      # an empty password, and `restart: unless-stopped` then retries that
      # refusal forever. `:?` makes compose fail once, up front, with this
      # message instead.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD; the postgres image refuses to boot without one and would crash-restart forever}
    volumes:
      - ${DATA_DIR:-./data}/db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [appnet]
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${LOG_MAX_SIZE:-10m}
        max-file: "${LOG_MAX_FILE:-3}"
    mem_limit: ${DB_MEM_LIMIT:-1g}
    cpus: ${DB_CPUS:-1.0}

networks:
  appnet:
    name: ${PROJECT_NAME:-yucer}-net
